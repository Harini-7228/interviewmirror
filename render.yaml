services:
  - type: web
    name: interviewmirror
    env: node
    plan: free
    buildCommand: npm ci && npm run lint && npm test && npm run build
    startCommand: npm run start
    envVars:
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_API_URL
        sync: false
      - key: GEMMA_MODEL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: interviewmirror
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
